; CoverSF settings (development build, Phase 1 spikes). Key codes are the game's keyboard idCodes, which are
; Windows virtual-key codes (Numpad 0 = 0x60, 1 = 0x61, 2 = 0x62, 3 = 0x63, 4 = 0x64, 5 = 0x65). NumLock on.
; Every spike has its own switch: set it to 0 to keep that spike out of the game.

[General]
bEnabled=1
; S0 test rig: name of a script the plugin runs by itself once a save has loaded and the player has stood still
; for 3 s (s2b = the input-rewriting test). Empty = none. It sends synthetic Space, W and S key presses, only
; while the game window is in the foreground. Set it to s2b for an automated run.
sTestScript=
; a file the camera hook writes one line per frame to (the camera root and its rotation, the two rig nodes, the framing), flushed after every line, so that a graphics driver reset leaves the last frames on disk (REFERENCE 23.2); empty = off
sCamBlackBox=
; after TEST COMPLETE, ask the game to quit (Main::quitGame, unverified): leave 0 until it has been tried once
bQuitAfterTest=0
; t2 script (Phase 2 rig): first stage after "ready" (1 = everything: cast-queue proof, floor scan, sensor spots; 5 = the sensor spots only)
iT2StartStage=1
; T3.5: Numpad 9 re-reads this file while the game runs (the cover settings, the sensor, the peek and the trigger mode take effect at once; the test script names do not change)
iReloadKey=0x69
; p3 script (Phase 3 rig, sTestScript=p3): which set runs (1 = Save29 wall: direction check, R1, R3, R6; 2 = Save30 low wall: R4; 3 = the Well doorway: R7)
iP3Set=1

[FrameTick]
; S1: per-frame task, once-a-second player-state log
bFrameTick=1
iLogIntervalMs=1000

[Input]
; S2: hook on PlayerCamera's input receiver, InputState, raw event log
bInputHook=1
iCoverKey=0x65
iMaxInputLogLines=1500

[InputRewrite]
; S2b: Numpad 1 starts or stops an automatic 20 s cycle (5 s normal, 5 s Jump swallowed with a method that
; changes every cycle, 5 s movement zeroed, 5 s movement halved). By hand: Numpad 7 toggles swallowing Jump,
; Numpad 2 zeroes movement, Numpad 3 scales it, Numpad 4 cycles the swallow method
; (0 unlink, 1 disabled flag, 2 status stop, 3 value zero)
bInputRewrite=1
; event-driven tests (they replace the timed cycle): each counted Jump press takes the next plan of a rotation;
; the movement sequence runs when the player has moved steadily for about a second (3 valid attempts per launch)
; where the rewrites are applied: 1 = PlayerControls::Manager's receiver (before the jump and movement handlers), 0 = the PlayerCamera hook (too late)
bRewriteAtControls=1
bJumpRotation=0
; order of the jump rotation: 0 pass through, 1 unlink, 2 disabled flag, 3 status stop, 4 value zero
sJumpPlans=0,2,3,4,1
bMoveSequence=0
iAutoRewriteKey=0x61
; the cycle also starts by itself after this many seconds of play (once per launch); 0 means never
bAutoRewriteStart=0
iAutoRewriteDelaySec=45
iSwallowJumpKey=0x67
iZeroMoveKey=0x62
iHalfMoveKey=0x63
iSwallowMethodKey=0x64
fMoveScale=0.5

[WorldProbe]
; S3: a compact probe (forward, down, left, right from chest height) is logged on its own while you play;
; Numpad 0 logs one full probe (nine-ray fan plus floor calibration) on demand
bWorldProbe=1
; off since S4b round 2: the automatic probe casts from task threads with the PlayerCamera singleton as query object, which the engine's own camera collision shares (REFERENCE 14.8, "Hazard"; fixed in Phase 2 task T2.0)
bAutoProbe=0
iAutoProbeMs=500
iProbeKey=0x60
fProbeRadius=0.10
fProbeRange=5.0
fChestHeight=1.2
fFanHalfAngleDeg=40.0
; T2.0: every cast runs inside the third-person camera's Update hook (before the engine's own camera cast); this many per call, the rest wait for the next frame
iMaxCastsPerFrame=32

[Sensor]
; T2.2 / T2.3: CoverSensor. Numpad 8 logs the cover candidate in front of the camera (kind, height, normal, distance, stand point, edges).
; Names and defaults of PLAN.md section 3.7; fProbeRadius (in [WorldProbe]) is the sphere radius of every cast.
bSensor=1
iSenseKey=0x68
; sense by itself, no key: when the player stops after moving 0.5 m, or the view has turned 30 degrees and settled (one query per trigger,
; never two at once, never within fSenseMinInterval of the last). Every query logs a "COVER candidate" and a "COVER scan" line. Off by default.
bSenseOnStop=0
fSenseStillTime=0.4
fSenseMinMove=0.5
fSenseTurnDeg=30
fSenseMinInterval=1.0
fMaxSnapDistance=2.5
fLowCoverMinHeight=0.70
; T2.4: from 1.70 m a top hides the standing player's head (was 1.40); up to fOverPeekMaxHeight the player can stand and aim over it
fHighCoverMinHeight=1.70
fOverPeekMaxHeight=1.25
; a wall whose standing point lies more than fSideSnapAngleDeg off the view is taken only within fSideSnapDistance of the player
fSideSnapAngleDeg=60
fSideSnapDistance=1.0
fMinCoverWidth=0.60
fEdgeProbeStep=0.15
fEdgeMargin=0.25
fTrackRateHz=20
; the rest are the sensor's own tuning values (see Core/CoverSensor.h)
fSearchHeight=0.5
iSearchRays=9
fSearchHalfAngleDeg=50
; 0.5: a wall at the edge of the fan counts 1.5 times as far as one straight ahead. Larger values prefer what the player points at
fSearchAngleWeight=0.5
fWallFitStep=0.15
fWallFitMaxRms=0.04
fStandoff=0.8
fNearTolerance=0.15
fHeightStep=0.15
fHeightStart=0.30
fMaxMeasuredHeight=1.80
fCapsuleRadius=0.30
fStandGap=0.05
fMaxFloorStep=0.35
fEdgeSearchRange=4.0
fTrackEdgeRange=2.0
; T3.0: a ray within this many degrees of the intent that hits in reach decides the search; the outer rays count only when none of these hits
fAheadHalfAngleDeg=20
iEdgeMissCount=1
fMaxNormalTurnDeg=45
fTrackTolerance=0.30

[Camera]
; S4: hook on ThirdPersonState::Update. fShoulderOffset is metres to the right of the view (negative = left);
; 0 leaves the camera alone. The flip key (Numpad 6) changes the side. The offset is shortened when a sphere cast
; from the camera hits something, keeping fCameraClearance metres free.
bCamera=1
; M4b11 (REFERENCE 23.27): slot 12 of the ThirdPersonState vtable is where the own camera hooks in. When another plugin already holds it (Dynamic Dialogue Camera, DDC.dll),
; iCameraChain=1 puts our hook in front of that plugin's function and calls it as the original, so both work; 0 = stand down as before (compatibility mode: no camera of our own).
; sCameraChainModules names the plugins that may be chained (file names, separated by commas). DyMC.dll (Stride) is never chained, whatever is written here. An owner not on the list, or one the plugin cannot name, keeps compatibility mode.
iCameraChain=1
sCameraChainModules=DDC.dll
fShoulderOffset=0.0
fCameraSmoothTime=0.20
iCameraFlipKey=0x66
bCameraCollision=1
; the engine's own over-the-shoulder INI settings (fOverShoulderPosX:Camera ...): logged at load; only the g2 test script writes them
bCameraSettings=1
; 4 = pivot shift (S4b, default): the offset is added to the pivot node's local x for the duration of Update, so the camera, the
; look-at point and the engine's own collision move together; 3 = added to the camera position only in the call-site hook (turns
; the view around the pivot, kept for comparison); 0 = never touch the camera
iCameraMode=4
; test aid: swap the shoulder each time the weapon is drawn
bCameraFlipOnDraw=0
fCameraClearance=0.15
; M4a (Phase 4), the own camera: the framing per situation is written into the camera rig's two nodes before the pose call and taken out again after it (boom: the distance behind the pivot, pivot: the
; shoulder and the height), every change eased over fFrameEase seconds; the engine's own collision works on the result. The situations: exploring (weapon away), weapon drawn, aiming, sprinting; in cover the
; drawn (and, while aiming, the aim) framing with the cover camera's offsets (fCoverCamBack*, fCoverCamUp*, bCoverCamera) on top. Off in compatibility mode (another camera mod, DyMC.dll).
bFraming=1
; the shoulder swap: this keyboard key (0x58 = X; the user's controller layout sends X for LT + A); the left shoulder is the mirror of the right plus fShoulderLeftExtra metres; the swap eases over fShoulderSwapEase seconds
iShoulderKey=0x58
fShoulderLeftExtra=0.06
fShoulderSwapEase=0.15
fFrameEase=0.25
; metres behind the pivot
fFrameDistExplore=2.1
fFrameDistDrawn=1.7
fFrameDistAim=0.95
fFrameDistSprint=2.4
; metres to the side of the pivot (right shoulder)
fFrameShoulderExplore=0.45
fFrameShoulderDrawn=0.45
fFrameShoulderAim=0.40
fFrameShoulderSprint=0.45
; metres added to the pivot's own height
fFrameHeightDrawn=-0.05
fFrameHeightAim=-0.05
; one log line when the situation changes
bFrameLog=1

[Cover]
; Phase 3, the cover system. OFF here: the planning session turns it on when the phase is ready; rig scripts switch it on for their own run.
bCover=0
; 1 = the game's own Sneak control (B on the pad, Left Ctrl on the keyboard) pressed while the movement input points at cover in reach takes cover;
; pressed otherwise it is the vanilla sneak toggle; pressed in cover it leaves. (Modes 0 and 2 arrive with T3.5.)
iCoverTrigger=1
; (2 = the Sneak control held for fCoverHoldTime takes cover, a tap stays the vanilla toggle; 0 = only the dedicated key [Input] iCoverKey, a keyboard code (0x65 = Numpad 5, which has no vanilla binding)
; and no movement input is needed; stance changes in modes 0 and 2 are made by a Sneak press made by the plugin)
fCoverHoldTime=0.25
; 3 = everything of mode 1, plus: cover is taken without a press when ALL of this has held for fAutoCoverTime seconds: no cover state running, cover allowed, no sprint, the
; movement input at least fCoverStickMin, a fresh Low or High cover in the direction of the input, the input within fAutoCoverAngleDeg of the direction to the wall, the
; stand point at most fAutoCoverDistance metres away and, for TALL cover, an open end within fAutoCoverTallEdge metres (0 = tall cover is never taken by itself, so a wall
; in a corridor does not grab the player). After any exit the automatic entry stays off until the pull toward cover has been absent for fAutoCoverRearm seconds.
; The Sneak control (B on the pad) in cover leaves; pressed while pushing toward cover it enters at once. In every mode the stance change of a cover press is made by a
; Sneak press of the plugin, never by the real press (the game toggles sneak for the pad's B on release, and only for a press held under about 0.4 s).
fAutoCoverTime=0.30
fAutoCoverRearm=0.30
fAutoCoverAngleDeg=35
fAutoCoverDistance=0.60
fAutoCoverTallEdge=1.2
; tall cover by itself (mode 3): 0 = never, 1 = only with an open end within fAutoCoverTallEdge (the old rule), 2 = anywhere, but only with the weapon drawn
iAutoCoverTall=2
; card M4b: the hold time with the weapon drawn, low and tall cover (cover at once: what is left is the freshness of the 10 Hz sensor answer); with the weapon away fAutoCoverTime stays
fAutoCoverTimeDrawn=0.05
; no longer read (replaced by fAutoCoverTimeDrawn)
fAutoCoverTimeTall=0.45
; 1 = a HUD line "CoverSF: in cover (low)" / "(tall)" when cover is taken and "CoverSF: left cover" when it ends (a test aid; a failure of the call switches it off)
bCoverNotify=0
; T5.3a, the cover camera for Basic: 1 = while in cover (or peeking) the third-person camera pulls back and up, so that more of the field in front of the wall is in the picture.
; The values are added to what the animation graph gives the camera's two nodes each frame (the boom's distance and the pivot's height), never stored; they ease in and out over
; fCoverCamEase seconds. Low cover and tall cover have their own pair (metres). While the aim is held the offset is multiplied by fCoverCamAimShare (0 = none, 1 = all).
; Off for the session after a fault. A camera mod that pulls the camera back to its own distance (Stride?) may undo it: that is what the rig run R11 measures.
bCoverCamera=0
; T5.2, the cover poses: 1 = while in cover (Phase 3 InCover) the player gets the NPC animation graph and the engine's own cover stance (crouched at low cover, back to the wall at tall cover), the game's own
; keys walk it along the wall and its own aim input aims; the Phase 3 peeks are off in the pose. Every exit gives the own graph back. Needs the camera rig hold (set by itself). Off for the session after a fault.
bCoverPoses=0
; the least wait (seconds) between clearing the archetype and the stance call; the call also waits until the NPC graph shows
; how the animation archetype is handled (stage A2): 0 = the keyword stays away for the whole pose and the weapon cycle brings the own graph back; 1 = the keyword stays away during the pose,
; the engine's "archetype change pending" byte is cleared after the stance call and the archetype asked for on the way out, no weapon cycle; 2 = the keyword is back right after the stance call
; and the byte cleared, the way out is the exit function only. Modes 1 and 2 fall back to the weapon cycle when the own graph is not read 1.0 s after the exit clip.
iPoseArchetypeMode=1
; development switches for the aim bisect (stage A3), all off: 1 = the aim is not given to Phase 3 while a pose is on, 2 = no position writes by Phase 3 while a pose is on,
; 4 = the movement filter off while a pose is on, 8 = no crouch under the pose at low cover (the player stays standing for the stance call)
iPoseDiagMask=0
; the pose needs the weapon drawn (the actor state's weapon state 3): with a sheathed weapon the first aim press makes the engine draw it, which drops the cover (REFERENCE 22.9). 0 = no pose with a
; sheathed weapon (the plain Phase 3 cover stays), 1 = the weapon is drawn first (the pose begins when it is up)
bPoseDrawWeapon=1
; T5.4 blind fire in the pose: the fire control pressed while the aim is not held sends BlindFireOverStart (low cover) or BlindFireStart (tall cover) and the press is swallowed; when the Into clip
; (fBlindFireIntoLow, fBlindFireIntoTall seconds) is over and the control is still held it is passed to the game as a fresh press. After the release the mode stays for fBlindFireLinger seconds (a new press
; inside it goes straight to the game), then BlindFireEnd. The aim pressed during blind fire: BlindFireEnd, the aim press waits for the Out clip (fBlindFireOutLow, fBlindFireOutTall).
bPoseBlindFire=1
; 0 = tall cover never takes the pose and stays Phase 3 Basic (the side peeks, no pose, the cover camera); 1 = the pose at tall cover as well (unfinished: the engine's aim does nothing there)
bPoseTall=1
; T5.2 tall pose (bPoseTall 1): the aim at a tall cover sends SightedStart / SightedEnd by itself (the engine's own aim does nothing in standing cover) when an Open end of the wall is within
; fEdgePeekRange on the side the actor is turned to; with only the other end open the actor turns round first; with no open end in reach the aim does nothing. Blind fire the same (BlindFireStart).
bPoseTallAim=1
; in the pose a movement input whose part along the wall is below fCoverAlongMin (or that points into the wall) is written as zero for the game at the controls hook: without it the engine's walk
; clip stepped on the spot while the player pushed into the wall (card M3g play; the rig's keyboard did not reproduce the stepping with or without this key, REFERENCE 22.18)
bPoseZeroInput=1
; the camera hold stays on through the way out and is eased to what the own graph gives over fPoseExitEase (1), or is released at the exit function (0, as before M3i: the camera root jumped 1.16 m in one frame)
bPoseExitHold=1
; 1 = the hold also writes the camera nodes' world translate: no effect on the camera (REFERENCE 22.19), off
bPoseHoldWorld=0
; with bPoseExitHold 1: seconds over which the hold is eased to what the own graph gives when the own graph is back (0 = dropped at once)
fPoseExitEase=0.4
; 1 = no exit clip: CoverEnd is sent to the graph, the stance field is written 0, the own archetype is asked for in the same tick (one turn of the body instead of two, REFERENCE 22.19); 0 = the engine's exit function and its clip
iPoseExitClip=1
; card M4b: a leave without the exit clip sometimes leaves the graph without an update (the boom reads -0.5188 for a second, the player cannot move, then the weapon cycle). 0.27 s after the leave
; a frozen graph gets this remedy: 0 nothing, 1 the ExitCover event (proved on the rig: the own graph back 0.84 s after the leave), 2 CoverEnd again (proved), 3 the engine exit function (did not help), 4 the own archetype again (did not help), 5 the weapon cycle at once
iPoseExitRemedy=1
; card M4b SPIKE (REFERENCE 23.7), off: at tall cover with the aim held the actor's heading is written to the cover's every frame (the body no longer swings round the 0.8 m arm of the
; side aim, through the wall), the view may turn at most fPoseCornerCone degrees either side (the weapon follows the crosshair within about 60), and the camera's pivot goes with the body
iPoseCornerHold=0
bPoseCornerCamera=1
fPoseCornerCone=55
; at the start of the corner aim the actor slides along the wall to this distance (m) from the open end (the body then ends 0.81 - this beyond the end); 0 = no slide
fPoseCornerEdge=0.50
; while the corner aim is on the camera is on the open side's shoulder (the player's own choice returns after the aim; a swap press during it is ignored); input along the wall is swallowed
bPoseCornerShoulder=1
; card M4b: idle in the tall pose, the stick still for fTallAutoTurnStill seconds, an open end within fEdgePeekRange on the other side (or clearly nearer by fTallAutoTurnMargin): the actor turns to it by itself.
; An aim press that arrives during a turn is held back and the aim starts when the turn is over if the control is still held.
bTallAutoTurn=1
fTallAutoTurnStill=0.30
fTallAutoTurnMargin=0.25
; card M4b (REFERENCE 23.11): the direction along the wall is reversed while the character walks and the pose's side does not turn (it walks backwards): the input is written as zero at the
; movement vector, the Enter event of the other side is sent, and the input goes to the game again when the side has turned (at most fPoseReverseRest seconds). The trigger is the input alone, held
; fPoseReverseHold seconds. iPoseReverse: 0 off, 1 tall cover only (default: low cover keeps its walk as it was), 2 tall and low.
iPoseReverse=1
fPoseReverseHold=0.10
fPoseReverseRest=2.5
; seconds over which the camera position is blended from its value at the pose's begin to what the engine gives: no effect on the dive at the entry (REFERENCE 22.19), off
fPoseEntryBlend=0
; one line at 5 Hz while Posed: the raw stick, what the game was given, iSyncIdleLocomotion, Speed, Direction
bPoseStickLog=1
; experiments for the way out, none of them helps (REFERENCE 22.18): 0 = as before; 1 = the own archetype is asked for in the same tick as the exit function; 2 = the body's angle z is written to the view yaw
; before the exit function (worse: the exit clip turns the body on by 66 degrees anyway); 3 = the movement input is written as zero from the exit function until the own graph is back (no change)
iPoseExitTurn=0
bPoseTallBlindFire=1
; 1 = the real aim press is held back from the game while the plugin sends its own aim events (an experiment, off)
iPoseTallAimSwallow=0
; the weapon controls in the pose: 0 = the favourites (the quick-keys and the wheel) are switched off by the engine's own input-enable layer while the pose is on and on again at every end of
; the pose (T5.9, works: the HUD's weapon stays, REFERENCE 22.14; the holster hold still holsters and ends the pose); 1 = a quick-key, the favourites control or the holster hold ends the pose first (M3b, T5.6)
iPoseWeaponSwap=0
; T5.8: in the pose the engine does not pitch the view (the player's pitch, the high process's float, stands still; REFERENCE 22.15). 1 = while the pose is on the plugin keeps a pitch of its
; own from the engine's look value (g[+0x68] * s1 * s2, so mouse and stick alike; the factor learned on the own graph, -0.5 before) and writes it into that float before and after the pose call.
bPoseFreePitch=1
iPoseFreePitchMode=1
; T5.6: nothing may be equipped or unequipped in the pose (the new weapon would not be shown): a quick-key or favourites press ends the pose at once, and so does the ready/holster
; control held this many seconds. The next pose waits until the weapon has been drawn for 0.5 s, the favourites wheel is closed and 1.0 s have passed.
fPoseHolsterHold=0.30
; T5.7: the reload in the pose is the cover component's own clip, which has no sound for the player. 0 (the user's decision, 2026-11-17 card M3b) = the reload stays in the pose, silent;
; 1 = the reload control pressed in the pose ends the pose first (the press is held back and made again when the own graph is back, so that the reload plays on the own graph with its sound)
; and no pose is taken for fPoseReloadTime seconds after it (the character leaves the cover to reload: not wanted).
bPoseReload=0
fPoseReloadTime=3.0
fBlindFireIntoLow=0.80
fBlindFireIntoTall=0.90
fBlindFireLinger=0.80
fBlindFireOutLow=1.17
fBlindFireOutTall=1.07
fPoseSwitchWait=0.0
; giving the own graph back: the own archetype is asked for, the weapon is holstered after fPoseHolsterAt seconds and drawn again after fPoseDrawAt (the NPC graph stays until the weapon cycle), the camera hold goes off
; after fPoseConfirmAt, and the camera boom node then says whether the own graph is back (once more with the same steps when it is not)
fPoseHolsterAt=0.0
fPoseDrawAt=0.6
fPoseConfirmAt=1.2
fCoverCamBackLow=0.90
fCoverCamUpLow=0.35
fCoverCamBackTall=0.60
fCoverCamUpTall=0.10
fCoverCamAimShare=0.35
fCoverCamEase=0.35
; the movement input must be pushed at least this far (keys count as 1), and the sensor's answer must be this recent (seconds) and
; for a direction within fCandidateMaxTurnDeg of where the input points now
fCoverStickMin=0.4
fCandidateMaxAge=0.35
fCandidateMaxTurnDeg=45
; background sensing while pushing toward something: Finds per second
fSenseRateHz=10
; a candidate whose stand point is farther than this from the player is not taken
fEnterMaxDistance=3.0
; entering: the eased move to the stand point (seconds), snap after fEnterMaxTime; the player staying this far behind the eased move 4 steps in a row = blocked
fEnterTime=0.25
fEnterMaxTime=0.40
fPathBlockedError=0.25
; leaving: Exiting lasts fExitTime; input away from the wall beyond fExitInputThreshold for fExitHoldTime; displaced more than fMaxDeviation (metres)
fExitTime=0.15
fExitHoldTime=0.25
fExitInputThreshold=0.6
fMaxDeviation=0.35
iLostLeaveCount=3
; T3.3, staying on cover: no Move stick event for fStickExpireTime seconds = the stick is centred; fCoverMoveScale multiplies the kept (along the wall) part of a stick;
; drift off the cover line beyond fHoldTolerance is corrected (fHoldMaxStep metres per logic tick at the most); a move of more than fShoveDistance in one logic tick
; by something other than our own write (a hit, an explosion) leaves cover at once; beyond fMaxDeviation off the line the cover is left, not corrected
fStickExpireTime=0.25
fCoverMoveScale=1.0
fHoldTolerance=0.08
fHoldMaxStep=0.04
; T3.3b / T3.3e: in cover the hook rewrites the game own movement vector (what a key or a stick made of it) after every input call: the part along the wall, at most
; fCoverMaxInput (the game input for a key is a full 1.0). The input is 0 from fEdgeStopDistance metres before the stop point (fEdgeMargin inside the end) on, falling
; linearly over the fEdgeBrakeDistance metres before that. Zero while entering, peeking or after Lost.
; Measured 2026-11-17 (REFERENCE 18.13 and 18.14): standing, written inputs up to 0.5 give the walk (1.0 m/s, 0.26 m of coasting), 0.6 and above the run (5.1 m/s, 1.6 to 1.9 m);
; crouched, 0.7 m/s up to 0.5 and 1.62 m/s at 1.0 with 0.27 m of coasting; between about 0.1 and 0.5 the speed does not change with the input, so a long linear brake does
; not slow the player and the stop distance does the work.
fCoverMaxInput=0.5
fEdgeBrakeDistance=0.15
fEdgeStopDistance=0.35
; the same three while the cover is LOW and the player is crouched (the crouched run)
fCoverMaxInputLow=1.0
fEdgeBrakeDistanceLow=0.15
fEdgeStopDistanceLow=0.50
; T3.3f: an along-the-wall part of the input smaller than this is written as exactly (0, 0) (the game speed is a step: a stick 6 to 17 degrees off the wall normal would walk along the wall)
fCoverAlongMin=0.30
; after the stand point is reached: for this long, while the along part of the input is below fCoverAlongMin, a player more than 0.03 m from where it was reached is brought back
; (at most 0.10 m a tick). 0 = off
fEnterSettleTime=1.0
fShoveDistance=0.15
; T3.4, peeking: aim (SecondaryAttack beyond 0.3) within fEdgePeekRange of an Open end of the cover moves the player to a point fSidePeekDistance past that end on the
; wall line over fPeekTime (if it has floor and a clear path); released: back. Aim held away from the ends of low cover no taller than fOverPeekMaxHeight stands the
; player up (a Sneak press made by the plugin) and crouches again on release. bPeek and bPeekOver switch them off
bPeek=1
bPeekOver=1
fPeekTime=0.15
; the eased peek move takes at least distance / fPeekSpeed (m/s)
fPeekSpeed=4.0
fSidePeekDistance=0.50
fEdgePeekRange=0.95
; the stance is checked this long after a Sneak press that should change it (logged; seconds)
fStanceCheckTime=0.3
; kill switches for the two sides of the feature: zeroing the movement input while entering, and moving the player with SetPosition
bCoverFilterInput=1
bCoverMove=1

[PlayerControl]
; S5: measurements used by the g2 test script (eased SetPosition, sneak, weapon and aim state)
bPlayerControl=1

[AnimRecon]
; S6: the g2 script sends the cover animation events to the player's graph and, for S6c, removes the AnimArchetypePlayer
; keyword from the player's actor base for a few seconds (put back at the end of the script)
bAnimRecon=1

[Anim]
; T5.0: sTestScript=p5 may call the engine's stance function on the player (docs/REFERENCE.md section 20). Kill switch, default off.
bStanceSpike=0
; 1: stages 1 and 2, 2: stages 1 to 5, 3: the tall wall of Save29, stages 3 to 5 with stance 5
iP5Mode=1
; 4: the camera rig sample and hold, the exit function, side true, stances 3 and 2 (T5.0b); 5: the cover's own verbs
; T5.0b: the camera hook may write stored local translates into the camera's boom and pivot nodes while the p5 script asks for it (default off)
bRigHold=0

[Audio]
; spike 23.13 / 23.14 (docs/REFERENCE.md 23.13, 23.14): the engine's reload sound plays only when the reload clip carries <audio> annotations; the cover reload clips carry none, so the reload in the cover pose is silent.
; iAudioProbe: 0 off (default); 1 the Wwise post calls are logged while the rig arms them, 2 logged always (60 lines a second at most). The hooks themselves are installed whenever iAudioProbe or iPoseReloadSound is not 0.
iAudioProbe=0
; iPoseReloadSound: 0 off; 1 (the play state, 23.14) the events the engine posts during an ordinary reload are learned (per weapon) and posted again, at the same fractions of the reload and on the
; same game object, when a reload runs in the cover pose.
iPoseReloadSound=1
; iPoseReloadSoundFile: 1 (default) the learned sequences are kept in CoverSF.reloadsound.txt beside this file, so that a weapon that was reloaded once outside cover has its sound in cover for good; 0 memory only
iPoseReloadSoundFile=1
