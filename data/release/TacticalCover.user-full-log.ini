; Tactical Cover 1.0.0 - settings (the author's own copy: the full log, for the video series)
; Lines starting with ; are comments. 1 = on, 0 = off. Times are in seconds, distances in metres.
; Delete a line to get its default back; every default is the value shown here.

[General]
; Master switch for the whole mod.
bEnabled=1
; 0 = a short log (load, hook decisions, errors, one line per cover entry and exit).
; 1 = the full developer log (much larger). The log is Documents\My Games\Starfield\SFSE\Logs\TacticalCover.log
bFullLog=1

[Cover]
; Take cover by walking into a wall and pushing against it.
bCover=1
; How long you push into a wall before you take cover, with your weapon away.
fAutoCoverTime=0.30
; The same with your weapon drawn (0.05 = almost at once).
fAutoCoverTimeDrawn=0.05
; Tall cover (walls you cannot see over): 0 = never by walking in, 1 = only near a corner you can lean out of, 2 = anywhere with your weapon drawn.
iAutoCoverTall=2
; Show a short message on screen when you take or leave cover.
bCoverNotify=0

[Camera]
; The mod's own over-the-shoulder camera, with the shoulder swap. 0 = leave the camera to the game.
; If another mod already controls the third-person camera, Tactical Cover turns its camera off by itself and cover still works.
bFraming=1
; Shoulder swap on a controller: hold LT (aim) and press A. The A press is not passed to the game while LT is held.
bShoulderPadChord=1
; Shoulder swap on the keyboard: a Windows key code (0x58 = X). 0 = no key.
iShoulderKey=0x58
; How far to the side of your character the camera sits (right shoulder; the left mirrors it), per situation.
fFrameShoulderExplore=0.45
fFrameShoulderDrawn=0.45
fFrameShoulderAim=0.40
fFrameShoulderSprint=0.45
; Extra distance for the left shoulder only.
fShoulderLeftExtra=0.06
; How far behind your character the camera sits, per situation.
fFrameDistExplore=2.1
fFrameDistDrawn=1.7
fFrameDistAim=0.95
fFrameDistSprint=2.4
